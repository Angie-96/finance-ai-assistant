name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build

      # TODO: run Playwright e2e (needs `npx playwright install --with-deps` and a real GOOGLE_GENERATIVE_AI_API_KEY/ALPHA_VANTAGE_API_KEY setup)
